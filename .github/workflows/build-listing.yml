name: Build Repo Listing

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:
  push:
    branches: main
    paths:
      - source.json
      - scripts/**
      - .github/workflows/build-listing.yml

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deployment
concurrency:
  group: "pages"
  cancel-in-progress: true

env:
  listPublishDirectory: Website
  pathToCi: ci

jobs:

  build-listing:
    name: build-listing
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:

      - uses: actions/checkout@v4 # check out this repo
      - name: Test migration safety gate
        run: python -m unittest discover -s scripts -p 'test_*.py'
      - name: Check Orbiters catalog and prepare handover
        id: orbiters
        run: python scripts/orbiters_migration.py
      - uses: actions/checkout@v4 # check out automation repo
        if: steps.orbiters.outputs.ready != 'true'
        with:
          repository: vrchat-community/package-list-action
          path: ${{env.pathToCi}}
          clean: false # otherwise the local repo will no longer be checked out

      - name: Restore Cache
        if: steps.orbiters.outputs.ready != 'true'
        uses: actions/cache@v4
        with:
          path: |
            ${{env.pathToCi}}/.nuke/temp
            ~/.nuget/packages
          key: ${{ runner.os }}-${{ hashFiles('**/global.json', '**/*.csproj') }}

      - name: Build Package Version Listing
        if: steps.orbiters.outputs.ready != 'true'
        run: ${{env.pathToCi}}/build.cmd BuildMultiPackageListing --root ${{env.pathToCi}} --list-publish-directory $GITHUB_WORKSPACE/${{env.listPublishDirectory}}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ${{env.listPublishDirectory}}

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
